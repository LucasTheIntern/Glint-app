<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLINT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="startup">
        <h1>GLINT</h1>
        <p>A frictionless culling engine.</p>
        <button id="btn-open">Select Folder</button>
        <div id="startup-version" class="version-tag"></div>
    </div>

    <div id="hud" class="hidden">
        <div class="stats">
            <span id="stat-count">0/0</span> | 
            <span id="stat-keep" class="keep-text">0% Keep</span> | 
            <span id="stat-reject" class="reject-text">0% Reject</span> |
            <span id="stat-burst" class="burst-text">Burst: None</span>
        </div>
        <div class="current-status">
            Rating: <span id="current-rating" class="rating-text">☆☆☆☆☆</span> | 
            Status: <span id="current-flag">None</span> |
            <span id="hud-version" class="hud-version"></span>
            <button id="btn-help" class="icon-btn" title="Hotkeys">[ ? ]</button>
        </div>
    </div>

    <div id="workspace" class="hidden">
        <div id="carousel-view" class="view-mode">
            <div id="c-node-0" class="carousel-slot"></div>
            <div id="c-node-1" class="carousel-slot"></div>
            <div id="c-node-2" class="carousel-slot"></div>
            <div id="c-node-3" class="carousel-slot"></div>
            <div id="c-node-4" class="carousel-slot"></div>
        </div>

        <div id="zoom-view" class="view-mode hidden"></div>
        <div id="compare-view" class="view-mode hidden">
            <div id="compare-left" class="compare-pane"></div>
            <div id="compare-right" class="compare-pane"></div>
        </div>
    </div>

    <div id="hotkey-modal" class="hidden">
        <div class="modal-content">
            <h2>Command Center</h2>
            <div class="hotkey-grid">
                <div><kbd>←</kbd> <kbd>→</kbd></div><div>Navigate</div>
                <div><kbd>C</kbd></div><div class="keep-text">Keep (✔)</div>
                <div><kbd>X</kbd></div><div class="reject-text">Reject (✖)</div>
                <div><kbd>1</kbd> - <kbd>5</kbd></div><div class="rating-text">Star Rating</div>
                <div><kbd>Space</kbd></div><div>Toggle Zoom</div>
                <div><kbd>Tab</kbd></div><div>Toggle Compare Burst</div>
                <div><kbd>G</kbd></div><div>Return to Main View</div>
                <div><kbd>D</kbd></div><div class="reject-text">Delete File (OS)</div>
                <div><kbd>?</kbd></div><div>Toggle this menu</div>
            </div>
            <button id="btn-close-help">Close</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
