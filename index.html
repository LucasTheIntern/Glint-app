<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLINT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="startup">
        <h1>GLINT</h1>
        <p>Temporal culling engine engaged.</p>
        <button id="btn-open">Initialize Drive</button>
        <div id="startup-version" class="version-tag"></div>
    </div>

    <div id="hud" class="hidden">
        
        <div class="ring-container" title="Data Cores">
            <svg class="gallifreyan-rings" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="50" class="ring-bg"></circle>
                <circle cx="60" cy="60" r="40" class="ring-bg"></circle>
                <circle cx="60" cy="60" r="25" class="ring-bg inner-spin" stroke-dasharray="10 20 40 10"></circle>
                
                <circle cx="60" cy="60" r="50" class="ring-data ring-keep" id="svg-keep"></circle>
                <circle cx="60" cy="60" r="40" class="ring-data ring-reject" id="svg-reject"></circle>
            </svg>
            <div class="ring-text">
                <span id="stat-count">0/0</span>
            </div>
        </div>

        <div class="current-status">
            <span id="stat-burst" class="burst-text">Vortex: Offline</span>
            <span class="divider">|</span>
            <select id="ar-select" class="hud-select" title="Dimensional Aspect">
                <option value="3/2">3:2 (Landscape)</option>
                <option value="2/3">2:3 (Portrait)</option>
                <option value="16/9">16:9 (Widescreen)</option>
                <option value="1/1">1:1 (Square)</option>
                <option value="4/3">4:3 (Standard)</option>
            </select>
            <span class="divider">|</span>
            Matrix: <span id="current-rating" class="rating-text">☆☆☆☆☆</span> | 
            Flag: <span id="current-flag">None</span> |
            <span id="hud-version" class="hud-version"></span>
            <button id="btn-help" class="icon-btn" title="Protocols">[ ? ]</button>
        </div>
    </div>

    <div id="workspace" class="hidden">
        <div id="carousel-view" class="view-mode">
            <div id="c-node-0" class="carousel-slot"></div>
            <div id="c-node-1" class="carousel-slot"></div>
            <div id="c-node-2" class="carousel-slot"></div>
            <div id="c-node-3" class="carousel-slot"></div>
            <div id="c-node-4" class="carousel-slot"></div>
        </div>

        <div id="zoom-view" class="view-mode hidden"></div>
        <div id="compare-view" class="view-mode hidden">
            <div id="compare-left" class="compare-pane"></div>
            <div id="compare-right" class="compare-pane"></div>
        </div>
    </div>

    <div id="hotkey-modal" class="hidden">
        <div class="modal-content">
            <h2>System Protocols</h2>
            <div class="hotkey-grid">
                <div><kbd>←</kbd> <kbd>→</kbd></div><div>Navigate Timeline</div>
                <div><kbd>C</kbd></div><div class="keep-text">Preserve (✔)</div>
                <div><kbd>X</kbd></div><div class="reject-text">Eradicate (✖)</div>
                <div><kbd>1</kbd> - <kbd>5</kbd></div><div class="rating-text">Matrix Rating</div>
                <div><kbd>Space</kbd></div><div>Toggle Focus</div>
                <div><kbd>Tab</kbd></div><div>Toggle Convergence (Compare)</div>
                <div><kbd>G</kbd></div><div>Return to Vortex</div>
                <div><kbd>D</kbd></div><div class="reject-text">Delete Anomaly (OS)</div>
                <div><kbd>?</kbd></div><div>Toggle this menu</div>
            </div>
            <button id="btn-close-help">Acknowledge</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
